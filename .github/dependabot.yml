version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # let a new release age before adopting it (hijacked releases are
    # usually yanked within days)
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # let a new release age before adopting it (hijacked releases are
    # usually yanked within days)
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
