name: Release

# Publishes to npm when a version tag (v1.2.3, v2.0.0-rc.1, ...) is pushed.
#
# Security model:
# - No npm token anywhere: npm Trusted Publishing (OIDC) authenticates this
#   exact workflow + environment, and npm attaches a provenance attestation.
# - Build/test and publish are separate jobs. Only `publish` can mint an OIDC
#   token, and it never installs dependencies or runs project code: it only
#   uploads the tarball that `build` produced and tested.
# - The tarball's SHA-256 is handed from `build` to `publish` and re-checked.
# - `publish` runs in the `npm` environment, which should require a manual
#   approval and only allow `v*` tags.
# - No dependency cache (cache poisoning), install scripts disabled, actions
#   pinned to commit SHAs, checkout without persisted credentials.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Verify & pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      dist-tag: ${{ steps.meta.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check tag matches package.json and is on master
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "::error::Tagged commit ${GITHUB_SHA} is not on master"
            exit 1
          fi
          # prereleases (1.2.3-rc.1) must not become `latest`
          case "${version}" in
            *-*) echo "dist-tag=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "dist-tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Pack
        id: pack
        run: |
          mkdir dist
          tarball="$(npm pack --ignore-scripts --pack-destination dist --json | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0))[0].filename)')"
          sha256="$(sha256sum "dist/${tarball}" | cut -d' ' -f1)"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          echo "### Package" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${tarball}\` sha256 \`${sha256}\`" >> "$GITHUB_STEP_SUMMARY"
          tar -tzf "dist/${tarball}" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: dist/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configure in Settings → Environments: required reviewer + "v*" tag rule.
    environment:
      name: npm
      url: https://www.npmjs.com/package/stomp-broker-js
    permissions:
      actions: read # download the artifact via `gh`
      id-token: write # npm Trusted Publishing + provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check npm supports Trusted Publishing (>= 11.5.1)
        run: |
          npm --version
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error("npm >= 11.5.1 required for trusted publishing");
              process.exit(1);
            }' "$(npm --version)"

      - name: Download tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name package --dir dist

      - name: Verify checksum
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "${SHA256}  dist/${TARBALL}" | sha256sum --check --strict

      - name: Publish
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: npm publish "./dist/${TARBALL}" --access public --tag "${DIST_TAG}" --ignore-scripts
